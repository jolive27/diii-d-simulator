name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

  lint:
    name: Lint (oxlint)
    runs-on: ubuntu-latest
    # Non-blocking for now: this is the first lint pass over the existing
    # codebase, so pre-existing findings should not gate merges yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  milestone-gates:
    name: Milestone evidence gates (informational)
    runs-on: ubuntu-latest
    # Informational only: the recorded M02 evidence fingerprint is historical.
    # A FAIL here means the saved evidence is stale for the current checkout
    # and needs fresh independent validation - it is not a build breakage.
    # See README.md ("Current status") and docs/REPOSITORY-PREPARATION.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Milestone status
        run: node tools/milestone-status.mjs

      - name: M02 gate
        run: node tools/workflow.mjs gate m02
